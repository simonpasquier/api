openapi: 3.0.0
info:
  description: The Observatorium API
  version: "0.0.1"
  title: Observatorium API
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  x-logo:
    url: 'https://observatorium.io/observatorium.png'
    altText: 'Observatorium logo'

# Keeping all the API paths here, but likely need to separate it out to another file,
# once paths for other signals are also added.
paths:
  /api/metrics/v1/{tenant}/api/v1/rules:
    parameters:
      - $ref: "#/components/parameters/tenant"
      - in: query
        name: type
        description: type of Rules
        schema:
          type: string
          enum:
            - alert
            - record
      - in: query
        name: match[]
        description: Repeated label selector argument
        schema:
          type: array
          items:
            type: string
    get:
      tags:
        - metrics/rulesv1
      summary: Get Rules for a tenant in JSON form
      operationId: getRules
      description: |
        You can get rules for a tenant with health data
      responses:
        "2XX":
          description: rule for a tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricRulesResponse"
        "4XX":
          description: Bad request
        "5XX":
          description: Server side error
  /api/metrics/v1/{tenant}/api/v1/labels:
    parameters:
      - $ref: "#/components/parameters/tenant"
      - $ref: "#/components/parameters/optionalSeriesMatcher"
      - $ref: "#/components/parameters/startTS"
      - $ref: "#/components/parameters/endTS"
    get:
      tags:
        - metrics/labelsv1
      summary: Get all labels for a tenant
      operationId: getLabels
      description: |
        You can get labels for a tenant
      responses:
        "2XX":
          description: labels for a tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricLabelsResponse"
        "4XX":
          description: Bad request
        "5XX":
          description: Server side error
  /api/metrics/v1/{tenant}/api/v1/label/{label_name}/values:
    parameters:
      - $ref: "#/components/parameters/tenant"
      - in: path
        name: label_name
        description: label name to get values for
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/optionalSeriesMatcher"
      - $ref: "#/components/parameters/startTS"
      - $ref: "#/components/parameters/endTS"
    get:
      tags:
        - metrics/labelvaluesv1
      summary: Get label values for a tenant
      operationId: getLabelValues
      description: |
        You can get label values for a label of a tenant
      responses:
        "2XX":
          description: label values for a tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricLabelValuesResponse"
        "4XX":
          description: Bad request
        "5XX":
          description: Server side error
  /api/metrics/v1/{tenant}/api/v1/query:
    parameters:
      - $ref: "#/components/parameters/tenant"
      - $ref: "#/components/parameters/promqlQuery"
      - $ref: "#/components/parameters/queryTimeout"
      - $ref: "#/components/parameters/queryDedup"
      - $ref: "#/components/parameters/queryPartialResponse"
      - in: query
        name: time
        description: Evaluation timestamp
        schema:
          type: string
          format: rfc3339 | unix_timestamp
    get:
      tags:
        - metrics/queryv1
      summary: Evaluate instant queries for a tenant
      operationId: getInstantQuery
      description: |
        You can evaluate instant queries for a tenant
      responses:
        "2XX":
          description: instance query result for a tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricQueryResponse"
        "4XX":
          description: Bad request
        "5XX":
          description: Server side error
  /api/metrics/v1/{tenant}/api/v1/query_range:
    parameters:
      - $ref: "#/components/parameters/tenant"
      - $ref: "#/components/parameters/promqlQuery"
      - $ref: "#/components/parameters/startTS"
      - $ref: "#/components/parameters/endTS"
      - $ref: "#/components/parameters/queryTimeout"
      - $ref: "#/components/parameters/queryDedup"
      - $ref: "#/components/parameters/queryPartialResponse"
      - in: query
        name: step
        description: Query resolution step width
        schema:
          type: string
    get:
      tags:
        - metrics/queryv1
      summary: Evaluate range queries for a tenant
      operationId: getRangeQuery
      description: |
        You can evaluate range queries for a tenant
      responses:
        "2XX":
          description: range query result for a tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricQueryRangeResponse"
        "4XX":
          description: Bad request
        "5XX":
          description: Server side error
  /api/metrics/v1/{tenant}/api/v1/series:
    parameters:
      - $ref: "#/components/parameters/tenant"
      - $ref: "#/components/parameters/seriesMatcher"
      - $ref: "#/components/parameters/startTS"
      - $ref: "#/components/parameters/endTS"
    get:
      tags:
        - metrics/seriesv1
      summary: Get series for a tenant
      operationId: getSeries
      description: |
        You can get series for a tenant
      responses:
        "2XX":
          description: series for a tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricSeriesResponse"
        "4XX":
          description: Bad request
        "5XX":
          description: Server side error

components:
  # Parameters
  parameters:
    tenant:
      in: path
      name: tenant
      description: name of the tenant
      required: true
      schema:
        type: string
    seriesMatcher:
      in: query
      name: match[]
      description: Repeated series selector argument
      required: true
      schema:
        type: array
        items:
          type: string
    optionalSeriesMatcher:
      in: query
      name: match[]
      description: Repeated series selector argument
      schema:
        type: array
        items:
          type: string
    startTS:
      in: query
      name: start
      description: Start timestamp
      schema:
        type: string
        format: rfc3339 | unix_timestamp
    endTS:
      in: query
      name: end
      description: End timestamp
      schema:
        type: string
        format: rfc3339 | unix_timestamp
    promqlQuery:
      in: query
      name: query
      description: PromQL query to fetch result for metrics
      schema:
        type: string
    queryTimeout:
      in: query
      name: timeout
      description: Evaluation timeout
      schema:
        type: string
    limit:
      in: query
      name: limit
      description: Max number of entries 
      schema:
        type: number
    queryDedup:
      in: query
      name: dedup
      description: Query deduplication (Thanos)
      schema:
        type: boolean
    queryPartialResponse:
      in: query
      name: partial_response
      description: Query partial response (Thanos)
      schema:
        type: boolean
  schemas:
    # Responses
    MetricSeriesResponse:
      type: object
      required:
        - status
        - data
      properties:
        error:
          type: string
        errorType:
          type: string
        warnings:
          type: array
          items:
            type: string
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
    MetricQueryResponse:
      type: object
      required:
        - status
        - data
      properties:
        error:
          type: string
        errorType:
          type: string
        warnings:
          type: array
          items:
            type: string
        status:
          type: string
          example: "success"
        data:
          type: object
          $ref: "#/components/schemas/MetricInstantQueryResponse"
    MetricQueryRangeResponse:
      type: object
      required:
        - status
        - data 
      properties:
        error:
          type: string
        errorType:
          type: string
        warnings:
          type: array
          items:
            type: string
        status:
          type: string
          example: "success"
        data:
          type: object
          $ref: "#/components/schemas/MetricRangeQueryResponse"
    MetricLabelsResponse:
      type: object
      required:
        - status
        - data
      properties:
        error:
          type: string
        errorType:
          type: string
        warnings:
          type: array
          items:
            type: string
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            type: string
    MetricLabelValuesResponse:
      type: object
      required:
        - status
        - data
      properties:
        error:
          type: string
        errorType:
          type: string
        warnings:
          type: array
          items:
            type: string
        status:
          type: string
        data:
          type: array
          items:
            type: string
            example: "node"
    MetricRulesResponse:
      type: object
      required:
        - status
        - data
      properties:
        error:
          type: string
        errorType:
          type: string
        warnings:
          type: array
          items:
            type: string
        status:
          type: string
          example: "success"
        data:
          type: object
          $ref: "#/components/schemas/Rules"
    # Models
    Rules:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RuleGroupEvaluated"
    RuleGroup:
      type: object
      required:
        - name
        - rules
      properties:
        interval:
          type: number
        name:
          type: string
          example: "telemeter.rules"
        rules:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/RecordingRule"
              - $ref: "#/components/schemas/AlertingRule"
    RuleGroupEvaluated:
      type: object
      required:
        - name
        - rules
      properties:
        interval:
          type: number
        name:
          type: string
          example: "telemeter.rules"
        file:
          type: string
          example: "rules.yaml"
        limit:
          type: number
          example: 0
        evaluationTime:
          type: number
          example: 0.002900887
        lastEvaluation:
          type: string
          example: "2022-02-20T15:32:12.759781322Z"
        partialResponseStrategy:
          type: string
          example: "WARN"
        rules:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/RecordingRuleEvaluated"
              - $ref: "#/components/schemas/AlertingRuleEvaluated"
    RecordingRule:
      type: object
      required:
        - expr
        - record
      properties:
        expr:
          type: string
          example: 'count by (name) (cluster{condition="halted"} == 1)'
        record:
          type: string
          example: "count:cluster_halted"
        labels:
          type: object
          additionalProperties:
            type: string
    RecordingRuleEvaluated:
      type: object
      required:
        - query
        - name
      properties:
        query:
          type: string
          example: 'count by (name) (cluster{condition="halted"} == 1)'
        name:
          type: string
          example: "count:cluster_halted"
        health:
          type: string
          example: "ok"
        evaluationTime:
          type: number
          example: 0.002900887
        lastError:
          type: string
        lastEvaluation:
          type: string
          example: "2022-02-20T15:32:12.759781322Z"
        type:
          type: string
          enum:
            - recording
        labels:
          type: object
          additionalProperties:
            type: string
    AlertingRule:
      type: object
      required:
        - alert
        - expr
      properties:
        alert:
          type: string
          example: "HighRequestLatency"
        expr:
          type: string
          example: 'job:request_latency_seconds:mean5m{job="myjob"} > 0.5'
        for:
          type: string
          example: "10m"
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    AlertingRuleEvaluated:
      type: object
      required:
        - query
        - name
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/ActiveAlert"
        query:
          type: string
          example: 'job:request_latency_seconds:mean5m{job="myjob"} > 0.5'
        name:
          type: string
          example: "count:cluster_halted"
        health:
          type: string
          example: "ok"
        evaluationTime:
          type: number
          example: 0.002900887
        lastError:
          type: string
        lastEvaluation:
          type: string
          example: "2022-02-20T15:32:12.759781322Z"
        type:
          type: string
          enum:
            - alerting
        duration:
          type: number
          example: 600
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    ActiveAlert:
      type: object
      required:
        - activeAt
        - state
        - value
      properties:
        activeAt:
          type: string
          example: "2018-07-04T20:27:12.60602144+02:00"
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        state:
          type: string
          example: "firing"
        value:
          type: string
          example: "1e+00"
    MetricInstantQueryResponse:
      type: object
      required:
        - resultType
        - result
      properties:
        resultType:
          type: string
          enum:
            - matrix
            - vector
            - scalar
            - string
            - streams
        result:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/RangeVectors" #matrix
              - $ref: "#/components/schemas/InstantVectors" #vector
              - $ref: "#/components/schemas/ScalarOrString" # scalar or string
              - $ref: "#/components/schemas/StreamValues" #streams
    MetricRangeQueryResponse:
      type: object
      required:
        - resultType
        - result
      properties:
        resultType:
          type: string
          enum:
            - matrix
        result:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/RangeVectors"
    ScalarOrString:
      type: array
      items:
        oneOf:
          - type: string
            format: unix_timestamp
          - type: string
            format: sample_value
    RangeVectors:
      type: object
      required:
        - metric
        - values
      properties:
        metric:
          type: object
          additionalProperties:
            type: string
        values:
          type: array
          items:
            type: array
            $ref: "#/components/schemas/ScalarOrString"
    InstantVectors:
      type: object
      required:
        - metric
        - values
      properties:
        metric:
          type: object
          additionalProperties:
            type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/ScalarOrString"
    StreamValues:
      type: object
      required:
        - stream
        - values
      properties:
        stream:
          type: object
          additionalProperties:
            type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/ScalarOrString"
